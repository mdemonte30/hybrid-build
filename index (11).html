'use strict';
// V2 uses a separate storage key. Old V1.2 browser logs remain untouched.
const KEY='hybrid-build-tracker-v2', OLDKEY='hybrid-build-tracker-1-2';
const DIST=[{1:3,3:3,5:4},{1:3,3:3,5:4.5},{1:3,3:3,5:5},{1:3,3:3,5:4}];
// Exercise: id, name, number of sets, rep prescription, superset group, notes, repsOnly
const DAYS=[
{title:'Upper Chest & Delts',tag:'LIFT + 3 MI',warm:'PVC/band shoulder movements and progressive Smith incline ramp-up sets.',desc:'Keep the seated fly between the two presses. Day 1 run can happen separately.',run:1,ex:[
['incline','Smith incline bench',3,'6–10','','Primary upper-chest press.'],
['seatedfly','Seated cable fly',2,'10–15','','Separate from the pressing patterns.'],

{title:'Lower Body, Back & Core',tag:'LIFT',warm:'Dynamic hip movement, a few comfortable adductor squeezes if tolerated, then trap-bar ramp-up sets.',desc:'Strength with modest quad work. Split squats before the RDL as requested.',ex:[

['split','DB split squat',2,'8 / leg','','Comfortable range; log weight per dumbbell.'],
['lat','Lat pulldown',3,'8–12','','Use controlled full-range reps.'],
['rdl','Romanian deadlift (RDL)',2,'8–10','','Controlled hip hinge; avoid chasing failure.'],
['wheel','Ab wheel rollout',2,'6–10','A1','Use controlled range without losing trunk position.',true],
['bayesian','Bayesian cable curl',2,'10–15 / arm','A2','Independent cable and ab-wheel stations.']]},
{title:'Chest, Back & Core',tag:'LIFT + 3 MI',warm:'Shoulder prep and barbell bench ramp-up sets.',desc:'Cable crunch and rear-delt fly are paired at the end. Run separately if convenient.',run:3,ex:[
['bench','Flat barbell bench',3,'6–10','','Main horizontal press.'],
['row','Seated cable row',3,'8–12','','Controlled row; no forced superset with bench.'],
['highfly','High-to-low cable fly',2,'10–15','','Separate working sets.'],
['crunch','Kneeling cable crunch',3,'10–15','A1','Keep the movement abdominal rather than hip dominant.'],
['rear','Isolation rear-delt fly',3,'12–20','A2','Set up independently from the crunch cable.']]},
{title:'Power, Shoulders, Arms & Core',tag:'LIFT',warm:'PVC/band prep and light clean technique sets, then pressing ramp-up.',desc:'Cleans first. Close-grip Smith press replaces guillotine pressing.',ex:[
['clean','Hang power clean',3,'2','','Explosive, technically crisp doubles. Controlled lowering; protect floor.'],
['closegrip','Close-grip Smith press',3,'6–10','','Shoulder-width-ish grip, controlled press.'],
['dblateral','DB lateral raise',3,'12–20','A1','Weight per dumbbell.'],
['ezcurl','EZ-bar cable curl',3,'10–15','A2','Use a separate cable station from the DBs.'],
['pallof','Pallof press',2,'10 / side','B1','Controlled anti-rotation.'],
['kickback','DB triceps kickback',2,'12–15','B2','DB work; no station change from Pallof.']]},
{title:'Long Run',tag:'RUN',desc:'Finish Day 5 by Saturday. Sunday is your weekly reset. Keep the run conversational and build distance toward May.',run:5,ex:[]}
];
function mondayISO(){const d=new Date();d.setHours(12,0,0,0);const dow=d.getDay();d.setDate(d.getDate()+(dow===0?1:1-dow));return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
const fresh=()=>({version:3,createdAt:new Date().toISOString(),startMonday:mondayISO(),entries:{}});
let data=fresh(),week=1,day=1,view='track',storageOK=true,legacyFound=false;const app=document.getElementById('app');
const key=(w,d)=>`w${w}d${d}`;
const H=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const P=()=>DAYS[day-1];const eNow=()=>data.entries[key(week,day)]||{sets:{},run:{},liftDone:false,runDone:false};
function complete(e,d){return (!DAYS[d-1].ex.length||!!e.liftDone)&&(!DAYS[d-1].run||!!e.runDone)}
function calendarWeek(){const d=new Date();d.setHours(12,0,0,0);if(d.getDay()===0)d.setDate(d.getDate()+1);const first=weekStart(1),diff=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(first.getFullYear(),first.getMonth(),first.getDate()))/(7*86400000));return Math.max(1,Math.min(4,diff+1))}
function next(){const active=calendarWeek();for(let w=active;w<=4;w++)for(let d=1;d<=5;d++)if(!complete(data.entries[key(w,d)]||{},d))return{w,d};for(let w=1;w<active;w++)for(let d=1;d<=5;d++)if(!complete(data.entries[key(w,d)]||{},d))return{w,d,backfill:true};return{w:4,d:5,all:true}}
function doneCount(w){let n=0;for(let d=1;d<=5;d++)n+=+complete(data.entries[key(w,d)]||{},d);return n}
function totalDone(){return [1,2,3,4].reduce((n,w)=>n+doneCount(w),0)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true}catch(_){storageOK=false}}
function modify(fn){const e=eNow();fn(e);if(complete(e,day)){if(!e.completedAt)e.completedAt=new Date().toISOString()}else e.completedAt=null;data.entries[key(week,day)]=e;save()}
function date(v){return v?new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):''}
function weekStart(w){let [y,m,d]=data.startMonday.split('-').map(Number);const dt=new Date(y,m-1,d,12);dt.setDate(dt.getDate()+7*(w-1));return dt}
function saturday(w){const dt=weekStart(w);dt.setDate(dt.getDate()+5);return dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function dateRange(w){const a=weekStart(w),b=new Date(a);b.setDate(a.getDate()+5);return `${a.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${b.toLocaleDateString(undefined,{month:'short',day:'numeric'})}`}
function jumpNext(){const n=next();week=n.w;day=n.d;view='track';save();render();window.scrollTo({top:0,behavior:'smooth'})}
function setHtml(x,e){const [id,name,num,reps,,note,repsOnly]=x;let out='';let all=true;for(let i=1;i<=num;i++){const sid=`${id}_${i}`,s=e.sets?.[sid]||{};all=all&&!!s.done;out+=`<div class="set ${s.done?'checked':''}"><span>Set ${i}</span>${repsOnly?'':`<label>Lb <input type="number" min="0" step=".5" inputmode="decimal" data-set="${sid}" data-field="weight" placeholder="—" value="${H(s.weight)}"></label>`}<label>Reps <input type="number" min="0" inputmode="numeric" data-set="${sid}" data-field="reps" placeholder="—" value="${H(s.reps)}"></label><label class="checkedlabel"><input type="checkbox" data-set="${sid}" data-field="done" ${s.done?'checked':''}>${s.done?'✓ Done':'Done'}</label></div>`}
return `<div class="exercise ${all?'allsets':''}"><div class="exhead"><div><strong>${H(name)}</strong><p>${num} × ${H(reps)} · ${H(note)}</p></div>${all?'<span class="chip done">✓ Complete</span>':''}</div>${out}</div>`}
function exercisesHtml(e){const ex=P().ex,items=[];for(let i=0;i<ex.length;i++){const x=ex[i],ss=x[4];if(ss&&ss.endsWith('1')&&i+1<ex.length&&ex[i+1][4]===ss[0]+'2'){
const y=ex[i+1];items.push(`<div class="ssgroup"><div class="sshead">↔ SUPERSET ${ss[0]} · TWO EXERCISES</div>${setHtml(x,e)}${setHtml(y,e)}<div class="ssfoot">Round: ${ss[0]}1 → ${ss[0]}2 → rest. Repeat for the prescribed sets.</div></div>`);i++}else items.push(setHtml(x,e))}return items.join('')}
function liftHtml(e){const p=P();if(!p.ex.length)return'';const num=p.ex.reduce((n,x)=>n+x[2],0),done=Object.values(e.sets||{}).filter(s=>s.done).length;return `<div class="card"><div class="blocktitle"><div><div class="eyebrow">LIFT · ~30 MIN EXCLUDING WARM-UP</div><h3>Set log</h3></div><span class="chip ${done===num?'done':''}">${done}/${num} sets ✓</span></div><div class="note"><b>Warm-up:</b> ${H(p.warm)}</div>${exercisesHtml(e)}<div class="check ${e.liftDone?'done':''}"><input id="liftDone" type="checkbox" data-done="liftDone" ${e.liftDone?'checked':''}><label for="liftDone"><b>${e.liftDone?'✓ Lifting complete':'Mark lifting complete'}</b></label></div></div>`}
function runHtml(e){if(!P().run)return'';const r=e.run||{},miles=DIST[week-1][day];return `<div class="card"><div class="blocktitle"><div><div class="eyebrow">${day===5?'LONG RUN':'EASY RUN'}</div><h3>Target: ${miles} miles</h3></div><span class="chip ${e.runDone?'done':''}">WEEK ${week}/4 ${e.runDone?'✓':''}</span></div><p class="caption">Conversational pace; distance is a progression target, not a requirement to push through worsening symptoms.</p><div class="fields"><div class="field"><label>Actual miles</label><input type="number" min="0" step=".01" inputmode="decimal" data-run="distance" placeholder="${miles}" value="${H(r.distance)}"></div><div class="field"><label>Time (mm:ss or hh:mm:ss)</label><input data-run="time" placeholder="32:15" value="${H(r.time)}"></div><div class="field"><label>Avg HR (optional)</label><input type="number" min="0" data-run="hr" placeholder="bpm" value="${H(r.hr)}"></div></div><div class="field" style="margin-top:10px"><label>Run notes / effort</label><textarea data-run="notes" placeholder="How did it feel?">${H(r.notes)}</textarea></div><div class="check ${e.runDone?'done':''}"><input id="runDone" type="checkbox" data-done="runDone" ${e.runDone?'checked':''}><label for="runDone"><b>${e.runDone?'✓ Run complete':'Mark run complete'}</b></label></div></div>`}

// Durable stopwatch for each day. Store elapsed segments and wall-clock anchors;
// updates remain accurate when iOS suspends the page or the phone is locked.
const emptyTimer=()=>({status:'idle',elapsedMs:0,segmentElapsedMs:0,anchorAt:null,laps:[],startedAt:null,finishedAt:null});
const timerFor=e=>e.timer||emptyTimer();
const msNow=()=>Date.now();
function timerTotal(t,n=msNow()){return Math.max(0,(Number(t.elapsedMs)||0)+(t.status==='running'&&Number.isFinite(t.anchorAt)?Math.max(0,n-t.anchorAt):0))}
function timerCurrent(t,n=msNow()){return Math.max(0,(Number(t.segmentElapsedMs)||0)+(t.status==='running'&&Number.isFinite(t.anchorAt)?Math.max(0,n-t.anchorAt):0))}
function fmtMs(ms){const s=Math.floor(Math.max(0,ms)/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
function activeTimer(){for(let w=1;w<=4;w++)for(let d=1;d<=5;d++){const t=data.entries[key(w,d)]?.timer;if(t&&(t.status==='running'||t.status==='paused'))return{w,d,t}}return null}
function settleTimer(t,n=msNow()){if(t.status==='running'){const delta=Number.isFinite(t.anchorAt)?Math.max(0,n-t.anchorAt):0;t.elapsedMs=(Number(t.elapsedMs)||0)+delta;t.segmentElapsedMs=(Number(t.segmentElapsedMs)||0)+delta;t.anchorAt=n}}
function timerAction(a){const other=activeTimer(),here=key(week,day);
 if(other&&key(other.w,other.d)!==here){alert(`Finish or reset the timer for Week ${other.w}, Day ${other.d} before starting another.`);return}
 const e=eNow();let t=timerFor(e),n=msNow();
 if(a==='timerStart'){if(t.status!=='idle')return;t={...emptyTimer(),status:'running',startedAt:new Date(n).toISOString(),anchorAt:n}}
 else if(a==='timerLap'){if(t.status!=='running')return;settleTimer(t,n);t.laps.push({ms:t.segmentElapsedMs,at:new Date(n).toISOString(),kind:'lap'});t.segmentElapsedMs=0;t.anchorAt=n}
 else if(a==='timerPause'){if(t.status!=='running')return;settleTimer(t,n);t.status='paused';t.anchorAt=null}
 else if(a==='timerResume'){if(t.status!=='paused')return;t.status='running';t.anchorAt=n}
 else if(a==='timerFinish'){if(!['running','paused'].includes(t.status))return;if(!confirm('Finish and save the stopwatch for this workout? This does not automatically check off lifting or running.'))return;settleTimer(t,n);if(t.segmentElapsedMs>0)t.laps.push({ms:t.segmentElapsedMs,at:new Date(n).toISOString(),kind:'final'});t.segmentElapsedMs=0;t.anchorAt=null;t.status='finished';t.finishedAt=new Date(n).toISOString()}
 else if(a==='timerReset'){if(!confirm('Reset only the stopwatch for this day, including its lap history? Your weights/reps and run logs will stay intact.'))return;t=emptyTimer()}
 else return;
 e.timer=t;data.entries[here]=e;save();render();
}
function timerHtml(){const active=activeTimer(),here=key(week,day);
 if(active&&key(active.w,active.d)!==here){return `<section class="timer-card timer-stick ${active.t.status}"><div class="timer-heading"><b>Workout stopwatch</b><span class="timer-status ${active.t.status}">${active.t.status.toUpperCase()}</span></div><div class="timer-values"><div class="timer-value"><label>Workout total</label><strong data-clock="total">${fmtMs(timerTotal(active.t))}</strong></div><div class="timer-value primary"><label>Current lap / rest</label><strong data-clock="current">${fmtMs(timerCurrent(active.t))}</strong></div></div><div class="timer-buttons"><button class="btn green" data-act="timerReturn" data-w="${active.w}" data-d="${active.d}">Return to Week ${active.w}, Day ${active.d}</button></div></section>`}
 const e=eNow(),t=timerFor(e),st=t.status,laps=t.laps||[];
 return `<section class="timer-card ${st} ${st==='running'||st==='paused'?'timer-stick':''}" aria-label="Workout stopwatch"><div class="timer-heading"><b>Workout stopwatch</b><span class="timer-status ${st}">${st==='idle'?'READY':st.toUpperCase()}</span></div><div class="timer-values"><div class="timer-value"><label>Workout total</label><strong data-clock="total">${fmtMs(timerTotal(t))}</strong></div><div class="timer-value primary"><label>Current lap / rest</label><strong data-clock="current">${fmtMs(timerCurrent(t))}</strong></div></div><div class="timer-buttons">
 ${st==='idle'?'<button class="btn green" data-act="timerStart">▶ Start workout</button>':''}
 ${st==='running'?'<button class="btn green" data-act="timerLap">↻ Lap / Rest</button><button class="btn" data-act="timerPause">Ⅱ Pause</button><button class="btn" data-act="timerFinish">Finish</button>':''}
 ${st==='paused'?'<button class="btn green" data-act="timerResume">▶ Resume</button><button class="btn" data-act="timerFinish">Finish</button><button class="btn danger" data-act="timerReset">Reset timer</button>':''}
 ${st==='finished'?`<span class="chip done">✓ Saved${t.finishedAt?' · '+H(new Date(t.finishedAt).toLocaleString()):''}</span><button class="btn" data-act="timerReset">Restart timer</button>`:''}
 </div><div class="caption">Tap Lap / Rest after a set: the interval is saved and the current timer immediately resets. Total time keeps running.</div>
 ${laps.length?`<details><summary>${laps.length} recorded interval${laps.length===1?'':'s'} · view laps</summary><div>${laps.map((l,i)=>`<div class="timer-lap"><span>${l.kind==='final'?'Final interval':`Lap ${i+1}`}</span><b>${fmtMs(l.ms)}</b></div>`).join('')}</div></details>`:''}
 </section>`}
function tickTimer(){const active=activeTimer(),t=active?active.t:timerFor(eNow());const n=msNow(),a=app.querySelector('[data-clock="total"]'),b=app.querySelector('[data-clock="current"]');if(a)a.textContent=fmtMs(timerTotal(t,n));if(b)b.textContent=fmtMs(timerCurrent(t,n))}
setInterval(tickTimer,250);document.addEventListener('visibilitychange',tickTimer);
function track(){const n=next(),p=P(),e=eNow(),c=complete(e,day);return `<div class="card"><div class="flex between wraprow"><button class="btn sm" data-act="week" data-n="-1" ${week===1?'disabled':''}>← Week</button><div style="text-align:center"><b>Week ${week} of 4</b><div class="small muted">${dateRange(week)} · Day 5 by ${saturday(week)}</div></div><button class="btn sm" data-act="week" data-n="1" ${week===4?'disabled':''}>Week →</button></div><div class="days">${DAYS.map((x,i)=>{const d=i+1,done=complete(data.entries[key(week,d)]||{},d);return `<button class="day ${day===d?'sel':''} ${done?'done':''}" data-act="day" data-n="${d}"><strong>${done?'✓':d}</strong><small>DAY ${d}</small></button>`}).join('')}</div><div class="flex between wraprow"><span class="caption">Any days Mon–Sat · New week selected each Sunday.</span><button class="btn sm gold" data-act="next">Next unfinished →</button></div></div><div class="hero"><div class="eyebrow">WEEK ${week} · DAY ${day}</div><h2>${H(p.title)}</h2><p class="sub">${H(p.desc)}</p><div class="flex wraprow" style="margin-top:13px"><span class="chip gold">${H(p.tag)}</span>${c?`<span class="chip done">✓ Completed ${date(e.completedAt)}</span>`:''}</div></div>${liftHtml(e)}${runHtml(e)}<div class="card"><h3>Session notes</h3><div class="field" style="margin-top:9px"><textarea data-session="notes" placeholder="Anything worth remembering...">${H(e.notes)}</textarea></div>${c?`<div class="completed">✓ Week ${week}, Day ${day} complete. ${n.all?'Block complete.':`Next unfinished: Week ${n.w}, Day ${n.d}.`}</div>`:'<p class="caption">Check lifting and running independently on combined days. Both must be complete to finish the day.</p>'}<button class="btn gold" style="width:100%" data-act="next">${n.all?'Review block':'Go to next unfinished day →'}</button></div>`}
function plan(){return `<div class="card"><h2>Four-week training block</h2><p class="sub">Five numbered days per week, completed by Saturday. Rest whenever needed; The app selects the new week on Sunday. No prescribed recovery-day slots.</p><table class="table"><tr><th>Week</th><th>Day 1</th><th>Day 3</th><th>Day 5</th><th>Total</th></tr>${DIST.map((d,i)=>`<tr><td>${i+1}</td><td>${d[1]} mi</td><td>${d[3]} mi</td><td>${d[5]} mi</td><td><b>${d[1]+d[3]+d[5]} mi</b></td></tr>`).join('')}</table><p class="caption">Week 4 is a lower-mileage week. Day 5's first milestone is 5 miles by Week 3.</p></div>${DAYS.map((p,i)=>{let ex='';for(let j=0;j<p.ex.length;j++){const x=p.ex[j],ss=x[4];if(ss&&ss.endsWith('1')&&p.ex[j+1]&&p.ex[j+1][4]===ss[0]+'2'){let y=p.ex[j+1];ex+=`<tr><td colspan="2" style="text-align:left;color:var(--green);font-weight:800;font-size:11px;border-bottom:0;padding-top:14px">↔ SUPERSET ${ss[0]} · ${ss} → ${y[4]} → REST</td></tr>`}ex+=`<tr><td>${ss?`<span class="chip done">${ss}</span> `:''}${H(x[1])}</td><td>${x[2]} × ${H(x[3])}</td></tr>`}return `<div class="card"><div class="blocktitle"><div><div class="eyebrow">DAY ${i+1}</div><h3>${H(p.title)}</h3></div><button class="btn sm" data-act="open" data-n="${i+1}">Open →</button></div><p class="caption">${H(p.desc)}</p><table class="table">${ex}</table>${p.run?`<div class="note green">Run targets by week: ${DIST.map(d=>d[i+1]+' mi').join(' / ')}</div>`:''}</div>`}).join('')}<div class="card"><h3>Supersets</h3><p class="sub">Complete A1, then A2, then rest; repeat for all rounds. The same applies to B1/B2. Pairings use independent equipment configurations.</p></div>`}
function history(){const arr=[];for(let w=1;w<=4;w++)for(let d=1;d<=5;d++){const e=data.entries[key(w,d)];if(e&&(e.liftDone||e.runDone||e.completedAt||Object.values(e.sets||{}).some(s=>s.done)))arr.push({w,d,e})}arr.sort((a,b)=>b.w*5+b.d-(a.w*5+a.d));return `<div class="card"><h2>History</h2><p class="sub">${totalDone()} of 20 days complete. Reopen a session to edit it.</p>${arr.length?arr.map(o=>`<div class="hist"><div><b>Week ${o.w} · Day ${o.d}</b><div>${H(DAYS[o.d-1].title)}</div><div class="caption">${o.e.completedAt?'✓ Complete '+date(o.e.completedAt):'Partially complete'} · ${Object.values(o.e.sets||{}).filter(s=>s.done).length} sets checked${o.e.runDone?` · ${H(o.e.run?.distance||'Not logged')} mi`:''}${o.e.timer?.status==='finished'?` · Timed ${fmtMs(o.e.timer.elapsedMs)}`:''}</div></div><button class="btn sm" data-act="history" data-w="${o.w}" data-d="${o.d}">View →</button></div>`).join(''):'<p class="caption">No workouts logged yet.</p>'}</div>`}
function download(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function settings(){return `<div class="card"><h2>Data & backup</h2><p class="sub">Autosaves to this device/browser, not to GitHub. Keep regular JSON backups. Your old V1.2 log uses a different storage key and remains untouched.</p><div class="note ${storageOK?'green':''}">${storageOK?'Local storage available.':'Local storage unavailable. Download a backup before leaving.'}</div><div class="flex wraprow" style="margin-top:13px"><button class="btn green" data-act="export">↓ Export V2 backup</button><label class="btn fileinput">↑ Import V2 backup<input id="import" type="file" accept=".json,application/json"></label>${legacyFound?'<button class="btn" data-act="oldexport">↓ Export previous V1.2 log</button>':''}</div><p class="caption">Importing replaces the current V2 log after confirmation; old-format workouts are not silently remapped to the new exercise list.</p><hr class="divider"><h3>Week 1 start date (Monday)</h3><p class="caption">Used only for the displayed Monday–Saturday dates. Doesn't delete workouts.</p><div class="field"><input id="startMonday" type="date" value="${H(data.startMonday)}"></div><hr class="divider"><h3>Reset V2 log</h3><p class="caption">Only resets this V2 log; your original V1.2 data is unaffected. Export first.</p><button class="btn danger" data-act="reset">Reset V2 workouts</button></div><div class="card"><h3>Installed on iPhone?</h3><p class="sub">After you replace the repository's index.html, reopen your existing Home Screen icon. It uses the same GitHub Pages URL. If the old screen is cached, close/reopen or refresh Safari. Look for the V2 label before logging.</p></div>`}
function render(){const n=next(),done=doneCount(week);app.innerHTML=`<div class="top"><div><div class="eyebrow">PHYSIQUE × PERFORMANCE</div><h1>HYBRID BUILD<span style="color:var(--gold)">.</span></h1><p class="sub">V2 · 4 lifts / 3 runs / 5 days per week</p></div><div class="logo">HB</div></div>${!storageOK?'<div class="alert">Autosave is unavailable here. Export your backup before leaving.</div>':''}<div class="stats"><div class="stat"><b>${done}<small style="font-size:12px"> / 5</small></b><span>Week ${week} days done</span><div class="meter"><i style="width:${done*20}%"></i></div></div><div class="stat"><b>${n.all?'✓':'D'+n.d}</b><span>Next unfinished${n.all?'':' · W'+n.w}</span></div><div class="stat"><b>${totalDone()}<small style="font-size:12px"> / 20</small></b><span>Block completed</span></div></div><nav class="nav">${[['track','Track'],['plan','Full plan'],['history','History'],['settings','Data & backup']].map(([v,label])=>`<button data-act="view" data-v="${v}" class="${view===v?'sel':''}">${label}</button>`).join('')}</nav>${timerHtml()}${view==='track'?track():view==='plan'?plan():view==='history'?history():settings()}<p class="footer">Hybrid Build V2 · By Saturday: Day 5 complete · Export backups regularly</p>`}
app.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a==='timerReturn'){week=+b.dataset.w;day=+b.dataset.d;view='track';render();return}if(a.startsWith('timer')){timerAction(a);return}if(a==='view')view=b.dataset.v;else if(a==='day'||a==='open'){day=+b.dataset.n;if(a==='open')view='track'}else if(a==='week')week=Math.max(1,Math.min(4,week+(+b.dataset.n)));else if(a==='next'){jumpNext();return}else if(a==='history'){week=+b.dataset.w;day=+b.dataset.d;view='track'}else if(a==='reset'){if(!confirm('Delete all V2 workout entries on this device? Export a backup first if needed.'))return;const oldStart=data.startMonday;data=fresh();data.startMonday=oldStart;week=1;day=1;view='track'}else if(a==='export'){download({app:'Hybrid Build V2',exportedAt:new Date().toISOString(),data},'hybrid-build-V2-backup-'+new Date().toISOString().slice(0,10)+'.json');return}else if(a==='oldexport'){try{const old=JSON.parse(localStorage.getItem(OLDKEY));download({app:'Hybrid Build 1.2 archived',exportedAt:new Date().toISOString(),data:old},'hybrid-build-V1.2-archive-'+new Date().toISOString().slice(0,10)+'.json')}catch(err){alert('Previous log could not be read: '+err.message)}return}save();render()});
app.addEventListener('input',ev=>{const b=ev.target;if(b.dataset.set&&b.dataset.field!=='done')modify(e=>{e.sets=e.sets||{};const s=e.sets[b.dataset.set]||{};s[b.dataset.field]=b.value;e.sets[b.dataset.set]=s});else if(b.dataset.run)modify(e=>{e.run=e.run||{};e.run[b.dataset.run]=b.value});else if(b.dataset.session)modify(e=>e[b.dataset.session]=b.value)});
app.addEventListener('change',async ev=>{const b=ev.target;if(b.dataset.done){modify(e=>e[b.dataset.done]=b.checked);render()}else if(b.dataset.set&&b.dataset.field==='done'){modify(e=>{e.sets=e.sets||{};const s=e.sets[b.dataset.set]||{};s.done=b.checked;e.sets[b.dataset.set]=s});render()}else if(b.id==='startMonday'){const dt=new Date(b.value+'T12:00:00');if(!Number.isFinite(dt.getTime())||dt.getDay()!==1){alert('Please select a Monday.');render();return}data.startMonday=b.value;week=calendarWeek();day=1;save();render()}else if(b.id==='import'){const f=b.files?.[0];if(!f)return;try{const o=JSON.parse(await f.text()),v=o.data||o;if(v.version!==3||!v.entries||typeof v.entries!=='object'||Array.isArray(v.entries))throw Error('This is not a V2 backup. Previous V1.2 logs remain separate.');if(!confirm('Replace your current V2 logs with this backup?'))return;data={...fresh(),...v};const n=next();week=n.w;day=n.d;view='track';save();render()}catch(err){alert('Import failed: '+err.message)}}});
try{localStorage.setItem('_hbtest','1');localStorage.removeItem('_hbtest');legacyFound=!!localStorage.getItem(OLDKEY);const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&d.version===3&&d.entries)data={...fresh(),...d}}}catch(_){storageOK=false}week=calendarWeek();day=1;for(let d=1;d<=5;d++){if(!complete(data.entries[key(week,d)]||{},d)){day=d;break}}render();
</script></body></html>
