<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101820"><title>Hybrid Build — Tracker</title><style>
:root{--bg:#101820;--panel:#192630;--panel2:#243743;--text:#f7f8f4;--muted:#a9b9c0;--line:#3b515c;--gold:#e5bd70;--green:#8addb1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.wrap{max-width:950px;margin:auto;padding:22px 13px 75px}.top{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:20px}.eyebrow{color:var(--gold);letter-spacing:.13em;font-weight:800;font-size:11px;text-transform:uppercase}h1{font-size:clamp(30px,5vw,43px);letter-spacing:-.05em;margin:3px 0 0;line-height:1.04}h2{font-size:25px;letter-spacing:-.03em;margin:3px 0}h3{font-size:17px;margin:0}.sub,.hint{color:var(--muted)}.sub{margin:5px 0}.hint{font-size:12px;margin:8px 0 12px}.logo{border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:9px;font-size:20px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat{padding:10px}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:var(--muted)}.meter{height:5px;background:#38505c;border-radius:9px;margin-top:8px;overflow:hidden}.meter i{height:100%;display:block;background:var(--gold)}.nav{display:flex;background:var(--panel);padding:5px;border-radius:11px;border:1px solid var(--line);gap:4px;margin-bottom:15px}.nav button{flex:1;border:0;border-radius:8px;padding:10px 4px;background:transparent;color:var(--muted);font-weight:700;font-size:12px}.nav button.sel{color:white;background:var(--panel2)}.card{padding:16px;margin:12px 0}.flex{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.wraprow{flex-wrap:wrap}.btn{color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-weight:750}.btn.sm{padding:6px 9px;font-size:12px}.btn.gold{color:#1e2725;background:var(--gold);border-color:var(--gold)}.btn.danger{border-color:#a76f6c;color:#ffb9ae}.btn:disabled{opacity:.4}.chip{display:inline-block;border:1px solid var(--line);color:var(--muted);padding:4px 8px;font-size:11px;font-weight:800;border-radius:30px}.chip.gold{border-color:#896c35;background:#403723;color:#f1d092}.chip.done{border-color:#55826a;background:#294438;color:var(--green)}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.day{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--muted);padding:8px 2px}.day strong{display:block;font-size:20px;color:white}.day small{font-size:10px}.day.sel{border-color:var(--gold);background:#483a25}.day.done strong{color:var(--green)}.hero{background:linear-gradient(120deg,#2d414b,#1a2932);border:1px solid #516773;padding:21px;border-radius:13px}.hero h2{font-size:clamp(24px,4vw,31px)}.blocktitle{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:12px}.note{border-left:3px solid var(--gold);background:var(--panel2);padding:10px 12px;font-size:12px;border-radius:0 7px 7px 0;margin:10px 0 13px}.exercise{border:1px solid var(--line);background:#15242d;border-radius:10px;margin:9px 0;overflow:hidden}.exhead{padding:11px;display:flex;justify-content:space-between;align-items:start;gap:9px}.exhead strong{font-size:14px}.exhead p{font-size:12px;color:var(--muted);margin:3px 0 0}.ssbanner{padding:6px 10px;background:#334952;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.08em}.set{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:0 11px 10px}.set span,.set label{font-size:11px;color:var(--muted)}.set span{width:31px}.set input[type=number]{background:var(--panel2);border:1px solid #506873;color:white;padding:7px;border-radius:6px;width:62px;font-size:14px}.set input[type=checkbox],.check input{height:18px;width:18px;accent-color:var(--green)}.set .checked{margin-left:auto;display:flex;align-items:center;gap:4px}.check{display:flex;align-items:center;gap:9px;padding:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea{width:100%;color:white;background:var(--panel2);border:1px solid #516571;padding:9px 10px;border-radius:9px}.field textarea{min-height:75px;resize:vertical}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.completed{border:1px solid #598669;background:#2a4639;color:#b5f1cd;padding:10px;border-radius:9px;margin-top:10px;font-size:13px}.hist{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.hist:last-child{border-bottom:0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:8px 3px;border-bottom:1px solid var(--line);text-align:right}.table th:first-child,.table td:first-child{text-align:left}.fileinput{position:relative;overflow:hidden}.fileinput input{position:absolute;inset:0;opacity:0;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:23px}.alert{background:#4b3b2b;border:1px solid #b88c4a;border-radius:10px;padding:10px;color:#ffdeae;font-size:12px}@media(max-width:600px){.stat b{font-size:21px}.stat span{font-size:10px}.card{padding:12px}.fields{grid-template-columns:repeat(2,1fr)}.nav button{font-size:11px}.wrap{padding-left:10px;padding-right:10px}.blocktitle{flex-wrap:wrap}}
</style></head><body><div id="app" class="wrap"></div><script>
'use strict';
const KEY='hybrid-build-tracker-1-2';
const DIST=[{1:2.5,3:3,5:3.5},{1:3,3:3,5:4},{1:3,3:3.5,5:4.5},{1:2.5,3:3,5:3.5}];
// exercise: id, name, sets, reps, superset marker, note, repsOnly
const DAYS=[
{title:'Upper Chest & Delts',tag:'LIFT + EASY RUN',warm:'PVC and band shoulders, then light-to-working ramp-up sets for incline.',desc:'High-priority chest and delts; easy run independently when convenient.',run:1,ex:[
['incline','Smith incline press',3,'6–10','','Main press; ~2 reps in reserve.'],['shpress','Smith shoulder press',2,'6–10','','Only weekly overhead-press slot.'],['clateral','Cable lateral raise',3,'12–20','','Control each rep.'],['fly','Low-to-high cable fly',2,'10–15','A1','Superset with pressdowns.'],['press','Rope triceps pressdown',2,'10–15','A2','A1 → A2 → rest.']]},
{title:'Power, Back & Legs',tag:'LIFT',warm:'Dynamic hips, squat pattern, optional tolerable 2 × 15–20 sec moderate adductor squeezes, clean practice and trap-bar ramp-up sets.',desc:'One purposeful lower-body strength day, not two full leg days.',ex:[
['clean','Hang power clean',3,'2','','Crisp doubles, never to failure; lower rather than drop on 8 mm floor.'],['trap','Trap-bar deadlift',2,'5','','Strong reps, approximately 2 reps in reserve.'],['pullup','Pull-ups',3,'6–10','','For added weight log added pounds; otherwise enter 0.'],['squat','Smith squat or split squat',2,'8–10','','Choose a comfortable quad movement.'],['pallof','Pallof press',2,'8–12 / side','','Controlled anti-rotation.']]},
{title:'Chest, Back & Biceps',tag:'LIFT + EASY RUN',warm:'Band pulls and shoulder movement, then progressive barbell bench ramp-up sets.',desc:'Antagonistic supersets for efficiency; real flat-dumbbell work included.',run:3,ex:[
['bbbench','Flat barbell bench',3,'6–10','A1','Bench + row; take enough rest for good pressing reps.'],['row','Seated cable row',3,'8–12','A2','A1 → A2 → rest.'],['dbbench','Flat DB bench',2,'10–15','B1','Log load per dumbbell.'],['lat','Lat pulldown',2,'10–12','B2','B1 → B2 → rest.'],['curl','Bayesian cable curl',2,'10–15 / arm','C1','C1 → C2 → rest.'],['crunch','Kneeling cable crunch',2,'10–15','C2','Flex through abs, not just hip hinge.']]},
{title:'Delts, Arms & Core',tag:'LIFT',warm:'PVC and bands, light isolation ramp-up for shoulders and elbows.',desc:'No repeated Smith shoulder press; DB work, arms, direct dynamic core.',ex:[
['dblat','DB lateral raise',3,'12–20','','Log load per dumbbell.'],['rear','Cable rear-delt crossover',2,'15–20','','Controlled posterior-delt reps.'],['bcurl','Bayesian cable curl',3,'10–15 / arm','A1','Arm superset.'],['tri','Overhead rope triceps extension',3,'10–15','A2','Cross-body cable extension is a valid swap.'],['chop','Cable woodchop',2,'10 / side','B1','Smooth rotation, not maximal force.'],['wheel','Ab wheel rollout',2,'6–10','B2','Stop before losing trunk control; knee raises are an alternative.',true]]},
{title:'Long Run',tag:'RUN',desc:'Gradually increase distance. Finish with something in reserve.',run:5,ex:[]}
];
const initial=()=>({entries:{},version:2,createdAt:new Date().toISOString()});let data=initial(),week=1,day=1,view='track',storageOK=true;const app=document.getElementById('app');
const key=(w,d)=>`w${w}d${d}`,P=()=>DAYS[day-1],H=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const eNow=()=>data.entries[key(week,day)]||{sets:{},run:{},liftDone:false,runDone:false};
function complete(e,d){return (!DAYS[d-1].ex.length||!!e.liftDone)&&(!DAYS[d-1].run||!!e.runDone)}
function next(){for(let w=1;w<=4;w++)for(let d=1;d<=5;d++)if(!complete(data.entries[key(w,d)]||{},d))return{w,d};return{w:4,d:5,all:true}}
function doneCount(){let n=0;for(let w=1;w<=4;w++)for(let d=1;d<=5;d++)n+=+complete(data.entries[key(w,d)]||{},d);return n}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true}catch(_){storageOK=false}}
function modify(fn){let e=eNow();fn(e);if(complete(e,day)){if(!e.completedAt)e.completedAt=new Date().toISOString()}else e.completedAt=null;data.entries[key(week,day)]=e;save()}
function date(v){return v?new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):''}
function jumpNext(){const n=next();week=n.w;day=n.d;view='track';save();render();window.scrollTo({top:0,behavior:'smooth'})}
function exHtml(x,e){let[id,name,num,reps,ss,note,repsOnly]=x, out='';for(let i=1;i<=num;i++){const idSet=`${id}_${i}`,s=e.sets?.[idSet]||{};out+=`<div class="set"><span>Set ${i}</span>${repsOnly?'':`<label>Lb <input type="number" min="0" step=".5" inputmode="decimal" data-set="${idSet}" data-field="weight" placeholder="—" value="${H(s.weight)}"></label>`}<label>Reps <input type="number" min="0" inputmode="numeric" data-set="${idSet}" data-field="reps" placeholder="—" value="${H(s.reps)}"></label><label class="checked"><input type="checkbox" data-set="${idSet}" data-field="done" ${s.done?'checked':''}>Done</label></div>`}return `<div class="exercise">${ss.endsWith('1')?`<div class="ssbanner">SUPERSET ${ss[0]} · Alternate the next two exercises, then rest</div>`:''}<div class="exhead"><div><strong>${H(name)}</strong><p>${num} × ${H(reps)} · ${H(note)}</p></div>${ss?`<span class="chip gold">${ss}</span>`:''}</div>${out}</div>`}
function liftHtml(e){const p=P();if(!p.ex.length)return'';return `<div class="card"><div class="blocktitle"><div><div class="eyebrow">LIFT · ~30 MIN EXCLUDING WARM-UP</div><h3>Set log</h3></div><span class="chip">${p.ex.reduce((a,x)=>a+x[2],0)} sets</span></div><div class="note"><b>Warm-up:</b> ${H(p.warm)}</div>${p.ex.map(x=>exHtml(x,e)).join('')}<div class="check"><input id="liftDone" type="checkbox" data-done="liftDone" ${e.liftDone?'checked':''}><label for="liftDone"><b>Mark lifting complete</b></label></div></div>`}
function runHtml(e){if(!P().run)return'';let r=e.run||{},miles=DIST[week-1][day];return `<div class="card"><div class="blocktitle"><div><div class="eyebrow">${day===5?'LONG RUN':'EASY RUN'}</div><h3>Target: ${miles} miles</h3></div><span class="chip">Cycle ${week}/4</span></div><p class="hint">Conversational effort. Mileage is a target, not a reason to push through worsening symptoms.</p><div class="fields"><div class="field"><label>Actual miles</label><input type="number" min="0" step=".01" inputmode="decimal" data-run="distance" placeholder="${miles}" value="${H(r.distance)}"></div><div class="field"><label>Time (mm:ss)</label><input data-run="time" placeholder="32:15" value="${H(r.time)}"></div><div class="field"><label>Avg HR (optional)</label><input type="number" min="0" data-run="hr" placeholder="bpm" value="${H(r.hr)}"></div></div><div class="field" style="margin-top:10px"><label>Run notes / effort</label><textarea data-run="notes" placeholder="How did it feel?">${H(r.notes)}</textarea></div><div class="check"><input id="runDone" type="checkbox" data-done="runDone" ${e.runDone?'checked':''}><label for="runDone"><b>Mark run complete</b></label></div></div>`}
function track(){const n=next(),p=P(),e=eNow(),isDone=complete(e,day);return `<div class="card"><div class="flex between wraprow"><button class="btn sm" data-act="week" data-n="-1" ${week===1?'disabled':''}>← Cycle</button><b>Cycle ${week} of 4</b><button class="btn sm" data-act="week" data-n="1" ${week===4?'disabled':''}>Cycle →</button></div><div class="days">${DAYS.map((x,i)=>{let d=i+1,c=complete(data.entries[key(week,d)]||{},d);return `<button class="day ${day===d?'sel':''} ${c?'done':''}" data-act="day" data-n="${d}"><strong>${c?'✓':d}</strong><small>DAY ${d}</small></button>`}).join('')}</div><div class="flex between wraprow"><span class="hint">Rolling order. Rest whenever needed.</span><button class="btn sm gold" data-act="next">Next unfinished →</button></div></div><div class="hero"><div class="eyebrow">DAY ${day} · CYCLE ${week}</div><h2>${H(p.title)}</h2><p class="sub">${H(p.desc)}</p><div class="flex wraprow" style="margin-top:12px"><span class="chip gold">${p.tag}</span>${isDone?`<span class="chip done">✓ Complete ${date(e.completedAt)}</span>`:''}</div></div>${liftHtml(e)}${runHtml(e)}<div class="card"><h3>Session notes</h3><div class="field" style="margin-top:9px"><textarea data-session="notes" placeholder="Anything worth remembering...">${H(e.notes)}</textarea></div>${isDone?`<div class="completed">✓ Day ${day} complete. ${n.all?'Block finished.':`Next suggested: Cycle ${n.w}, Day ${n.d}.`}</div>`:'<p class="hint">Check off lift and/or run above. On combined days both count toward completing the day.</p>'}<button class="btn gold" style="width:100%" data-act="next">${n.all?'Review block':'Go to next unfinished day →'}</button></div>`}
function plan(){return `<div class="card"><h2>Five-session rolling plan</h2><p class="sub">Day 1 → Day 2 → Day 3 → Day 4 → Day 5. No prescribed calendar rest day. Rest as needed between sessions. Four cycles in Block 1.</p><table class="table"><tr><th>Cycle</th><th>Day 1</th><th>Day 3</th><th>Day 5</th><th>Total</th></tr>${DIST.map((d,i)=>`<tr><td>${i+1}</td><td>${d[1]} mi</td><td>${d[3]} mi</td><td>${d[5]} mi</td><td><b>${d[1]+d[3]+d[5]} mi</b></td></tr>`).join('')}</table></div>${DAYS.map((p,i)=>`<div class="card"><div class="blocktitle"><div><div class="eyebrow">DAY ${i+1}</div><h3>${H(p.title)}</h3></div><button class="btn sm" data-act="open" data-n="${i+1}">Open →</button></div><p class="hint">${H(p.desc)}</p><table class="table">${p.ex.map(x=>`<tr><td><b>${H(x[1])}</b> ${x[4]?`<span class="chip gold">${x[4]}</span>`:''}</td><td>${x[2]} × ${H(x[3])}</td></tr>`).join('')}</table>${p.run?`<div class="note">Run by cycle: ${DIST.map(d=>d[i+1]).join(' / ')} miles</div>`:''}</div>`).join('')}<div class="card"><h3>Superset notation</h3><p class="sub">A1 → A2 → rest. Repeat for required rounds. Same idea for B and C. Rest ~60–90 seconds after each pair; use longer where needed for quality barbell sets.</p><div class="note">Direct core: Day 2 Pallof press; Day 3 cable crunch; Day 4 cable woodchop and ab wheel.</div></div>`}
function history(){let arr=[];for(let w=1;w<=4;w++)for(let d=1;d<=5;d++){let e=data.entries[key(w,d)];if(e&&(e.liftDone||e.runDone||e.completedAt))arr.push({w,d,e})}arr.sort((a,b)=>(b.e.completedAt||'').localeCompare(a.e.completedAt||'')||(b.w*5+b.d-a.w*5-a.d));return `<div class="card"><h2>History</h2><p class="sub">${doneCount()} of 20 sessions complete. You can reopen any session to edit it.</p>${arr.length?arr.map(o=>`<div class="hist"><div><b>Cycle ${o.w} · Day ${o.d}</b><div>${H(DAYS[o.d-1].title)}</div><div class="hint">${o.e.completedAt?date(o.e.completedAt):'Partially complete'} · ${Object.values(o.e.sets||{}).filter(s=>s.done).length} sets checked${o.e.runDone?` · Run: ${H(o.e.run?.distance||'not logged')} mi`:''}</div></div><button class="btn sm" data-act="history" data-w="${o.w}" data-d="${o.d}">View →</button></div>`).join(''):'<p class="hint">Nothing logged yet. Start at Day 1.</p>'}</div>`}
function settings(){return `<div class="card"><h2>Storage & backup</h2><p class="sub">Autosaves on this device/browser where supported. Not cloud synced. Export before changing devices or clearing browser data.</p><div class="note">${storageOK?'Browser storage currently available.':'Browser storage unavailable here: export your backup before closing.'}</div><div class="flex wraprow" style="margin-top:13px"><button class="btn gold" data-act="export">↓ Export JSON backup</button><label class="btn fileinput">↑ Import JSON backup<input id="import" type="file" accept=".json,application/json"></label></div><p class="hint">An import replaces this device's current log after confirmation.</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Reset</h3><p class="hint">Deletes the current log on this browser. Export first if needed.</p><button class="btn danger" data-act="reset">Reset everything</button></div><div class="card"><h3>On your phone</h3><p class="sub">For reliable iPhone use, place this index.html on a static HTTPS host (for example, GitHub Pages), open its link in Safari, then Share → Add to Home Screen. This is a single-file app without accounts, external dependencies or network requests.</p><p class="hint">Local HTML opened inside an iOS Files preview may not support persistent storage. The app will warn you when browser storage is unavailable. Keep JSON backups.</p></div>`}
function render(){let n=next();app.innerHTML=`<div class="top"><div><div class="eyebrow">PHYSIQUE × PERFORMANCE</div><h1>HYBRID BUILD<span style="color:var(--gold)">.</span></h1><p class="sub">Block 1.2 · 4 lifts / 3 runs / 5 rolling days</p></div><div class="logo">HB</div></div>${!storageOK?'<div class="alert">Local autosave is unavailable here. Export a backup before closing.</div>':''}<div class="stats"><div class="stat"><b>${doneCount()} <small style="font-size:12px">/ 20</small></b><span>Days completed</span><div class="meter"><i style="width:${5*doneCount()}%"></i></div></div><div class="stat"><b>${n.all?'✓':'D'+n.d}</b><span>Next unfinished</span></div><div class="stat"><b>${n.w} <small style="font-size:12px">/ 4</small></b><span>Current cycle</span></div></div><nav class="nav">${[['track','Track'],['plan','Full plan'],['history','History'],['settings','Data & backup']].map(x=>`<button data-act="view" data-v="${x[0]}" class="${view===x[0]?'sel':''}">${x[1]}</button>`).join('')}</nav>${view==='track'?track():view==='plan'?plan():view==='history'?history():settings()}<p class="footer">Hybrid Build 1.2 · Export backups regularly</p>`}
app.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a==='view')view=b.dataset.v;else if(a==='day'||a==='open'){day=+b.dataset.n;if(a==='open')view='track'}else if(a==='week')week=Math.max(1,Math.min(4,week+(+b.dataset.n)));else if(a==='next'){jumpNext();return}else if(a==='history'){week=+b.dataset.w;day=+b.dataset.d;view='track'}else if(a==='reset'){if(!confirm('Delete ALL logs? Export a backup first if you want one.'))return;data=initial();week=1;day=1;view='track'}else if(a==='export'){const blob=new Blob([JSON.stringify({app:'Hybrid Build 1.2',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='hybrid-build-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);return}save();render()});
app.addEventListener('input',ev=>{const b=ev.target;if(b.dataset.set&&b.dataset.field!=='done')modify(e=>{e.sets=e.sets||{};const s=e.sets[b.dataset.set]||{};s[b.dataset.field]=b.value;e.sets[b.dataset.set]=s});else if(b.dataset.run)modify(e=>{e.run=e.run||{};e.run[b.dataset.run]=b.value});else if(b.dataset.session)modify(e=>e[b.dataset.session]=b.value)});
app.addEventListener('change',async ev=>{const b=ev.target;if(b.dataset.done){modify(e=>e[b.dataset.done]=b.checked);render()}else if(b.dataset.set&&b.dataset.field==='done'){modify(e=>{e.sets=e.sets||{};const s=e.sets[b.dataset.set]||{};s.done=b.checked;e.sets[b.dataset.set]=s})}else if(b.id==='import'){const f=b.files?.[0];if(!f)return;try{const o=JSON.parse(await f.text()),v=o.data||o;if(!v.entries||typeof v.entries!=='object'||Array.isArray(v.entries))throw Error('Invalid backup');if(!confirm('Replace your current logs with this backup?'))return;data={...initial(),...v};const n=next();week=n.w;day=n.d;view='track';save();render()}catch(err){alert('Import failed: '+err.message)}}});
try{localStorage.setItem('_hbtest','1');localStorage.removeItem('_hbtest');const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&d.entries)data={...initial(),...d}}}catch(_){storageOK=false}const n=next();week=n.w;day=n.d;render();
</script></body></html>
